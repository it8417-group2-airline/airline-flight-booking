<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Airline Flight Booking - multi-database integration project">
  <title>Airline Flight Booking - IT8417 Group 2</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1F3A"/><stop offset="0.55" stop-color="#12386A"/><stop offset="1" stop-color="#0E6B80"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#BFF3FA"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.25" r="0.5">
      <stop offset="0" stop-color="#F2B544" stop-opacity="0.35"/><stop offset="1" stop-color="#F2B544" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="round"><rect width="1280" height="360" rx="22"/></clipPath>
    <style>
      .t  { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .fade1 { opacity: 0; animation: up .9s ease-out .2s forwards; }
      .fade2 { opacity: 0; animation: up .9s ease-out .6s forwards; }
      .fade3 { opacity: 0; animation: up .9s ease-out 1.0s forwards; }
      @keyframes up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
      .route { stroke-dasharray: 2 10; animation: flow 1.6s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -24; } }
      .tw { animation: tw 3s ease-in-out infinite; }
      @keyframes tw { 50% { opacity: .15; } }
      .ping { transform-origin: center; transform-box: fill-box; animation: ping 2.4s ease-out infinite; }
      @keyframes ping { from { transform: scale(.6); opacity: .9; } to { transform: scale(2.6); opacity: 0; } }
    </style>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1280" height="360" fill="url(#sky)"/>
    <rect width="1280" height="360" fill="url(#glow)"/>
    <!-- stars -->
    <g fill="#FFFFFF">
      <circle class="tw" cx="640" cy="40" r="1.4"/><circle class="tw" cx="760" cy="90" r="1.1" style="animation-delay:.8s"/>
      <circle class="tw" cx="905" cy="34" r="1.5" style="animation-delay:1.6s"/><circle class="tw" cx="1180" cy="70" r="1.2" style="animation-delay:.4s"/>
      <circle class="tw" cx="1050" cy="300" r="1.1" style="animation-delay:2.1s"/><circle class="tw" cx="700" cy="310" r="1.3" style="animation-delay:1.1s"/>
      <circle class="tw" cx="1230" cy="200" r="1.0" style="animation-delay:2.6s"/><circle class="tw" cx="820" cy="190" r="1.0" style="animation-delay:.2s"/>
    </g>
    <!-- drifting clouds -->
    <g fill="#FFFFFF" opacity="0.07">
      <g><ellipse cx="900" cy="250" rx="120" ry="26"/><ellipse cx="960" cy="236" rx="70" ry="24"/>
        <animateTransform attributeName="transform" type="translate" values="0 0; -60 0; 0 0" dur="18s" repeatCount="indefinite"/></g>
      <g><ellipse cx="1150" cy="130" rx="90" ry="20"/><ellipse cx="1190" cy="120" rx="50" ry="18"/>
        <animateTransform attributeName="transform" type="translate" values="0 0; 50 0; 0 0" dur="22s" repeatCount="indefinite"/></g>
    </g>
    <!-- flight route + airports -->
    <path id="arc" d="M700,285 C820,120 1040,90 1190,150" fill="none" stroke="#BFF3FA" stroke-width="2.5" stroke-linecap="round" class="route" opacity="0.85"/>
    <g class="t" font-size="13" font-weight="700" fill="#BFF3FA">
      <circle cx="700" cy="285" r="6" fill="#F2B544"/><circle class="ping" cx="700" cy="285" r="6" fill="none" stroke="#F2B544" stroke-width="2"/>
      <text x="676" y="314">BAH</text>
      <circle cx="1190" cy="150" r="6" fill="#19B5C9"/><circle class="ping" cx="1190" cy="150" r="6" fill="none" stroke="#19B5C9" stroke-width="2" style="animation-delay:1.2s"/>
      <text x="1172" y="180">LHR</text>
      <circle cx="905" cy="152" r="3.5" fill="#FFFFFF" opacity=".7"/><text x="890" y="140" font-size="11" opacity=".7">DOH</text>
    </g>
    <g fill="#FFFFFF">
      <path d="M-16,-2 L4,-2 L12,-12 L16,-12 L11,-2 L18,-2 L22,-6 L25,-6 L22,0 L25,6 L22,6 L18,2 L11,2 L16,12 L12,12 L4,2 L-16,2 Z"/>
      <animateMotion dur="7s" repeatCount="indefinite" rotate="auto" keyPoints="0;1" keyTimes="0;1" calcMode="spline" keySplines="0.45 0 0.55 1">
        <mpath href="#arc"/>
      </animateMotion>
    </g>
    <!-- text -->
    <g class="t">
      <text class="fade1" x="64" y="88" font-size="15" font-weight="700" letter-spacing="3" fill="#F2B544">IT8417 · ADVANCED CLOUD DATABASES · GROUP 2</text>
      <text class="fade1" x="62" y="150" font-size="56" font-weight="800" fill="url(#title)">Airline Flight Booking</text>
      <text class="fade2" x="64" y="192" font-size="21" fill="#D6E4F5">Four databases, three cloud platforms, one live dashboard</text>
      <g class="fade3" font-size="14" font-weight="700">
        <rect x="64"  y="226" width="118" height="34" rx="17" fill="#336791"/><text x="123" y="248" text-anchor="middle" fill="#FFFFFF">PostgreSQL</text>
        <rect x="192" y="226" width="104" height="34" rx="17" fill="#7C4DFF"/><text x="244" y="248" text-anchor="middle" fill="#FFFFFF">pgvector</text>
        <rect x="306" y="226" width="116" height="34" rx="17" fill="#FF3621"/><text x="364" y="248" text-anchor="middle" fill="#FFFFFF">Databricks</text>
        <rect x="432" y="226" width="106" height="34" rx="17" fill="#13AA52"/><text x="485" y="248" text-anchor="middle" fill="#FFFFFF">MongoDB</text>
        <rect x="64"  y="270" width="110" height="34" rx="17" fill="#FF4B4B"/><text x="119" y="292" text-anchor="middle" fill="#FFFFFF">Streamlit</text>
        <rect x="184" y="270" width="104" height="34" rx="17" fill="#3ECF8E"/><text x="236" y="292" text-anchor="middle" fill="#0B1F3A">Supabase</text>
        <rect x="298" y="270" width="160" height="34" rx="17" fill="#F2B544"/><text x="378" y="292" text-anchor="middle" fill="#0B1F3A">Gemini embeddings</text>
      </g>
    </g>
  </g>
</svg>
