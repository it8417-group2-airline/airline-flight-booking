<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="980" viewBox="0 0 1280 980" role="img" aria-label="System architecture: four databases and seven data flows">
  <title>System architecture - 4 databases, 7 data flows</title>
  <defs><marker id="arrow-1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FF3621"/></marker><marker id="arrow-2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#13AA52"/></marker><marker id="arrow-3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#13AA52"/></marker><marker id="arrow-4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E0A020"/></marker><marker id="arrow-5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C4DFF"/></marker><marker id="arrow-6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#19B5C9"/></marker><marker id="arrow-7" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FF4B4B"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .flow { stroke-dasharray: 9 7; animation: dash 1.1s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -32; } }
    </style>
  </defs>
  <rect x="1" y="1" width="1278" height="978" rx="20" fill="#FFFFFF" stroke="#D8DEE8"/>
  <text x="40" y="54" font-size="28" font-weight="800" fill="#0B1F3A">System architecture</text>
  <text x="40" y="82" font-size="16" fill="#4A5A70">4 databases · 3 cloud platforms · 7 data flows (numbered as in the brief) · moving dashes show the direction</text>

  
    <g>
      <rect x="40" y="105" width="460" height="545" rx="18" fill="#EEF4FF" stroke="#336791" stroke-width="1.5"/>
      <text x="62" y="139" font-size="22" font-weight="800" fill="#336791">Supabase · PostgreSQL</text>
      <text x="62" y="161" font-size="14.5" fill="#4A5A70">Member 1 · operational + vector roles</text>
    </g>
  
    <g>
      <rect x="100" y="175" width="360" height="118" rx="12" fill="#FFFFFF" stroke="#D0D7E2"/>
      <rect x="100" y="175" width="6" height="118" rx="3" fill="#336791"/>
      <text x="122" y="204" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="700" fill="#0B1F3A">mainline_carrier</text><text x="122" y="230" font-size="15.5" font-weight="700" fill="#336791">normalised (3NF) · 6 tables</text><text x="122" y="253" font-size="15" font-weight="400" fill="#4A5A70">passenger · flight · booking</text><text x="122" y="276" font-size="15" font-weight="400" fill="#4A5A70">ticket · airport · cabin_class</text></g>
  
    <g>
      <rect x="100" y="310" width="360" height="118" rx="12" fill="#FFFFFF" stroke="#D0D7E2"/>
      <rect x="100" y="310" width="6" height="118" rx="3" fill="#336791"/>
      <text x="122" y="339" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="700" fill="#0B1F3A">regional_partner</text><text x="122" y="365" font-size="15.5" font-weight="700" fill="#336791">denormalised · 4 tables</text><text x="122" y="388" font-size="15" font-weight="400" fill="#4A5A70">traveler · route</text><text x="122" y="411" font-size="15" font-weight="400" fill="#4A5A70">reservation · fare_line</text></g>
  
    <g>
      <rect x="100" y="445" width="360" height="182" rx="12" fill="#FFFFFF" stroke="#D0D7E2"/>
      <rect x="100" y="445" width="6" height="182" rx="3" fill="#7C4DFF"/>
      <text x="122" y="474" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="700" fill="#0B1F3A">vector_store</text><text x="122" y="500" font-size="15.5" font-weight="700" fill="#7C4DFF">pgvector · HNSW cosine index</text><text x="122" y="523" font-size="15" font-weight="400" fill="#4A5A70">flight_note_embeddings</text><text x="122" y="546" font-size="15" font-weight="400" fill="#4A5A70">embedding vector(1536)</text><text x="122" y="569" font-size="15" font-weight="400" fill="#4A5A70">Gemini gemini-embedding-001</text><text x="122" y="592" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="700" fill="#7C4DFF">match_flight_notes()</text></g>

  
    <g>
      <rect x="800" y="105" width="440" height="245" rx="18" fill="#FFF3EE" stroke="#FF3621" stroke-width="1.5"/>
