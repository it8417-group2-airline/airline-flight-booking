  <text x="822" y="254" font-size="15.5" fill="#0B1F3A">raw → typed, cleansed, reconciled → star</text>
  <text x="822" y="279" font-size="15" fill="#4A5A70">fact table + dim_date + merged dimensions</text>
  <text x="822" y="320" font-size="15.5" font-weight="700" fill="#FF3621">"Sync now" → refresh, before / after</text>

  
    <g>
      <rect x="800" y="380" width="440" height="270" rx="18" fill="#EDF9F2" stroke="#13AA52" stroke-width="1.5"/>
      <text x="822" y="414" font-size="22" font-weight="800" fill="#13AA52">MongoDB Atlas</text>
      <text x="822" y="436" font-size="14.5" fill="#4A5A70">Member 3 · NoSQL role</text>
    </g>
  
    <g>
      <rect x="822" y="455" width="396" height="96" rx="12" fill="#FFFFFF" stroke="#D0D7E2"/>
      <rect x="822" y="455" width="6" height="96" rx="3" fill="#13AA52"/>
      <text x="844" y="484" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="700" fill="#0B1F3A">passenger_feedback</text><text x="844" y="510" font-size="15.5" font-weight="700" fill="#13AA52">imported IDs + reviews[], ratings, likes</text><text x="844" y="533" font-size="15" font-weight="400" fill="#4A5A70">booking_id · passenger_id · flight_id</text></g>
  
    <g>
      <rect x="822" y="563" width="396" height="74" rx="12" fill="#FFFFFF" stroke="#D0D7E2"/>
      <rect x="822" y="563" width="6" height="74" rx="3" fill="#13AA52"/>
      <text x="844" y="592" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="700" fill="#0B1F3A">baggage_events</text><text x="844" y="618" font-size="15.5" font-weight="700" fill="#13AA52">checked · loaded · delayed · lost</text></g>

  
    <g>
      <rect x="240" y="690" width="800" height="112" rx="18" fill="#FFF1F2" stroke="#FF4B4B" stroke-width="1.5"/>
      <text x="262" y="724" font-size="22" font-weight="800" fill="#FF4B4B">Streamlit dashboard</text>
      <text x="262" y="746" font-size="14.5" fill="#4A5A70">connects live to all 4 databases · hosted from GitHub</text>
    </g>
  <g font-size="14" font-weight="700">
    <rect x="262" y="756" width="170" height="34" rx="17" fill="#FFFFFF" stroke="#336791"/><text x="347" y="778" text-anchor="middle" fill="#336791">1 · Operational</text>
    <rect x="446" y="756" width="170" height="34" rx="17" fill="#FFFFFF" stroke="#FF3621"/><text x="531" y="778" text-anchor="middle" fill="#FF3621">2 · Warehouse</text>
    <rect x="630" y="756" width="190" height="34" rx="17" fill="#FFFFFF" stroke="#13AA52"/><text x="725" y="778" text-anchor="middle" fill="#13AA52">3 · Passenger Feedback</text>
    <rect x="834" y="756" width="190" height="34" rx="17" fill="#FFFFFF" stroke="#7C4DFF"/><text x="929" y="778" text-anchor="middle" fill="#7C4DFF">4 · Semantic Search</text>
  </g>

  
