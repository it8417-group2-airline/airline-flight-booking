  <circle cx="62" cy="860" r="13" fill="#FFFFFF" stroke="#FF3621" stroke-width="2.2"/><text x="62" y="865" text-anchor="middle" font-size="14" font-weight="800" fill="#FF3621">1</text><text x="86" y="866" font-size="16" fill="#0B1F3A">ETL: both schemas to the warehouse</text><circle cx="462" cy="860" r="13" fill="#FFFFFF" stroke="#13AA52" stroke-width="2.2"/><text x="462" y="865" text-anchor="middle" font-size="14" font-weight="800" fill="#13AA52">2</text><text x="486" y="866" font-size="16" fill="#0B1F3A">Import core records (IDs kept)</text><circle cx="862" cy="860" r="13" fill="#FFFFFF" stroke="#13AA52" stroke-width="2.2"/><text x="862" y="865" text-anchor="middle" font-size="14" font-weight="800" fill="#13AA52">3</text><text x="886" y="866" font-size="16" fill="#0B1F3A">Extend: reviews, ratings, likes</text><circle cx="62" cy="894" r="13" fill="#FFFFFF" stroke="#E0A020" stroke-width="2.2"/><text x="62" y="899" text-anchor="middle" font-size="14" font-weight="800" fill="#E0A020">4</text><text x="86" y="900" font-size="16" fill="#0B1F3A">Sync-back of aggregates</text><circle cx="462" cy="894" r="13" fill="#FFFFFF" stroke="#7C4DFF" stroke-width="2.2"/><text x="462" y="899" text-anchor="middle" font-size="14" font-weight="800" fill="#7C4DFF">5</text><text x="486" y="900" font-size="16" fill="#0B1F3A">Embed notes + review text</text><circle cx="862" cy="894" r="13" fill="#FFFFFF" stroke="#19B5C9" stroke-width="2.2"/><text x="862" y="899" text-anchor="middle" font-size="14" font-weight="800" fill="#19B5C9">6</text><text x="886" y="900" font-size="16" fill="#0B1F3A">Enrich similarity results</text><circle cx="62" cy="928" r="13" fill="#FFFFFF" stroke="#FF4B4B" stroke-width="2.2"/><text x="62" y="933" text-anchor="middle" font-size="14" font-weight="800" fill="#FF4B4B">7</text><text x="86" y="934" font-size="16" fill="#0B1F3A">Serve the live dashboard</text>
