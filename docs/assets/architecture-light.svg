      <text x="822" y="161" font-size="14.5" fill="#4A5A70">Member 2 · analytical role</text>
    </g>
  <g font-size="16" font-weight="700">
    <rect x="822" y="178" width="116" height="42" rx="10" fill="#FFFFFF" stroke="#CD7F32"/><text x="880" y="204" text-anchor="middle" fill="#CD7F32">Bronze</text>
    <rect x="962" y="178" width="116" height="42" rx="10" fill="#FFFFFF" stroke="#8A9BA8"/><text x="1020" y="204" text-anchor="middle" fill="#8A9BA8">Staging</text>
    <rect x="1102" y="178" width="116" height="42" rx="10" fill="#FFFFFF" stroke="#E0A020"/><text x="1160" y="204" text-anchor="middle" fill="#E0A020">Gold</text>
